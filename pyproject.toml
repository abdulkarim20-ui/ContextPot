[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ContextPot"
version = "1.0.0"
description = "Modern PySide6 Repository & Project Tree Crawler, File Explorer, and Plain Text Exporter."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6,<7",
]

[project.scripts]
ContextPot = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

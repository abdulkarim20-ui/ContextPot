name: 🐛 Bug Report
description: Report an issue or unexpected behavior in ContextPot.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible to help us diagnose and fix it quickly.
  - type: input
    id: os
    attributes:
      label: Operating System
      description: What Windows version are you running?
      placeholder: Windows 11 (23H2) / Windows 10
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python Version
      description: Run `python --version` and paste the output.
      placeholder: Python 3.11.5
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description of the Bug
      description: A clear and concise description of what happened.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior?
      placeholder: |
        1. Open ContextPot
        2. Drag folder 'xyz' onto launcher
        3. Click 'Export' with 'Whole code + Tree'
        4. See error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal Logs / Traceback (if applicable)
      description: Paste any console output or error logs here.
      render: shell
